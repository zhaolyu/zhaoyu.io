# Deploy to Cloudflare Pages
#
# This workflow handles:
# - Production deployments on main branch merges
# - Manual deployments via workflow_dispatch
#
# Note: PR preview deployments are handled by ci.yml workflow
#
# Optimizations:
# - Builds directly (no artifact download needed, avoids permission issues)
# - Concurrency group prevents duplicate deployments for the same branch
# - Manual dispatch available for cases where CI was skipped (e.g., docs-only changes)

name: Deploy to Cloudflare Pages

on:
  # Production deployment: Trigger on push to main branch (PR merges)
  push:
    branches:
      - main
  # Manual trigger for cases where CI was skipped (e.g., docs-only changes)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    timeout-minutes: 15
    # Permissions needed for creating deployments
    permissions:
      contents: read
      deployments: write
    # Prevent concurrent deployments for the same branch
    # Group by branch name to prevent duplicate deployments
    concurrency:
      group: deploy-${{ github.ref_name || 'unknown' }}
      cancel-in-progress: true
    steps:
      - name: Determine branch and commit
        id: branch-info
        run: |
          # For push events, use the branch from the event
          # For manual dispatch, use current ref
          BRANCH="${{ github.ref_name }}"
          REF="${{ github.ref }}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "Using branch: $BRANCH"
          echo "Using ref: $REF"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ steps.branch-info.outputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm run sync

      # Quality gates — this workflow runs on direct pushes to main, which
      # otherwise deploy to production without any checks at all.
      - name: Type check
        working-directory: frontend
        run: pnpm run check

      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      - name: Test
        working-directory: frontend
        run: pnpm run test

      - name: Build
        working-directory: frontend
        run: pnpm run build
        continue-on-error: false

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Error: build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "❌ Error: build/index.html not found"
            exit 1
          fi
          echo "✅ Build output verified successfully"
          echo "Build size:"
          du -sh build/

      - name: Determine deployment type
        id: deployment
        run: |
          # Use branch from previous step
          BRANCH="${{ steps.branch-info.outputs.branch }}"

          if [ "$BRANCH" = "main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "Deploying to PRODUCTION"
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Deploying to PREVIEW (dev environment)"
          fi

      # wrangler-action replaces the deprecated cloudflare/pages-action@v1.
      # Outputs: deployment-url (atomic) and pages-deployment-alias-url (branch alias).
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=zhaoyu-io --branch=${{ steps.deployment.outputs.branch }}

      - name: Record GitHub deployment
        if: steps.deploy.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const isProd = '${{ steps.deployment.outputs.environment }}' === 'production';
            const url = isProd
              ? 'https://zhaoyu.io'
              : '${{ steps.deploy.outputs.deployment-url }}'.trim();
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: isProd ? 'production' : 'preview',
              transient_environment: !isProd,
              production_environment: isProd,
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: url,
              auto_inactivate: true,
            });
            console.log('✅ Deployment record created:', url);

      - name: Check deployment status
        if: steps.deploy.outcome == 'success'
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Deployment may take a few moments to propagate."

      - name: Output Deployment URLs
        if: steps.deploy.outcome == 'success'
        run: |
          echo "🌐 Deployment completed successfully!"
          echo ""
          if [ "${{ steps.deployment.outputs.environment }}" = "preview" ]; then
            echo "**Preview Deployment URLs:**"
            echo "  - Atomic URL: ${{ steps.deploy.outputs.deployment-url }}"
            echo "  - Branch Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          else
            echo "**Production Deployment:**"
            echo "  - URL: ${{ steps.deploy.outputs.deployment-url }}"
          fi
          echo ""
          echo "⚠️  If you see 'Nothing is here yet' when visiting the URL:"
          echo "   1. Wait 1-2 minutes for deployment to propagate"
          echo "   2. Check Cloudflare Pages dashboard → Deployments tab"
          echo "   3. Verify the deployment status is 'Success'"
