name: Cost Guard - Report Infrastructure Costs

# Manual-only: this repo has no Terraform, so there is no real cost data to
# compute here. Running on every push used to send a hardcoded $0 snapshot
# per commit, flooding the /infra dashboard with empty "Estimate" rows.
# Trigger manually (with a real estimate) to exercise the ingestion pipeline.
on:
  workflow_dispatch:
    inputs:
      total_monthly_estimate:
        description: 'Total monthly estimate (USD) for this snapshot'
        required: true
        default: '0'

concurrency:
  group: cost-guard-${{ github.sha }}
  cancel-in-progress: true

jobs:
  report-costs:
    runs-on: ubuntu-latest
    name: Send Cost Snapshot
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Send cost snapshot to Cost-Guard
        env:
          COST_GUARD_SECRET: ${{ secrets.COST_GUARD_SECRET }}
          INGESTION_URL: https://ingestion-api-240dd81-538316597788.us-central1.run.app/v1/ingest
          COMMIT_SHA: ${{ github.sha }}
          ESTIMATE: ${{ inputs.total_monthly_estimate }}
        run: |
          # The estimate is a workflow_dispatch input. It used to be interpolated
          # straight into an unquoted heredoc, where the shell still performs
          # command substitution — so an input of $(...) would have executed.
          # Validate it, then let jq build the JSON so quoting is never our job.
          case "$ESTIMATE" in
            '' | *[!0-9.]* | *.*.* )
              echo "❌ total_monthly_estimate must be a non-negative number (got: $ESTIMATE)"
              exit 1
              ;;
          esac

          BODY=$(jq -cn \
            --arg org_id "4915feab-e474-439a-823f-9f2b914ca447" \
            --arg project_id "zhaoyu-io" \
            --arg commit_hash "$COMMIT_SHA" \
            --argjson total_monthly_estimate "$ESTIMATE" \
            '{$org_id, $project_id, $commit_hash, $total_monthly_estimate, costs: []}')

          # Generate HMAC-SHA256 signature
          SIGNATURE="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$COST_GUARD_SECRET" | cut -d' ' -f2)"

          # Send to ingestion API
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$INGESTION_URL" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -d "$BODY")

          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Cost-Guard ingestion failed with status $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Cost snapshot sent successfully"
