# GitHub Actions workflow for CI checks and deployment on pull requests
#
# This workflow:
# - Triggers on pull request creation (opened), reopening (reopened), and new commits (synchronize)
# - Runs type checking, linting, testing, and build verification in parallel
# - Deploys to Cloudflare Pages after successful build
# - Ensures code quality before merging
#
# Optimizations:
# - Parallel job execution for faster feedback (~2-3 min vs ~4-5 min sequential)
# - All jobs include SvelteKit sync step for consistency
# - Build artifacts removed (deployment workflow builds directly)
# - Concurrency control prevents duplicate runs on rapid commits
# - Path-based filtering skips CI for docs/config-only changes
# - Draft PR skipping saves minutes until PR is ready for review

name: CI - Quality Checks and Build

on:
  pull_request:
    types: [opened, reopened, synchronize]
    # Run CI on PRs targeting any branch (including feature/... branches)
    # Skip CI for documentation-only changes. Workflow changes deliberately
    # DO run CI — ignoring '.github/**' meant workflow edits got zero checks.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.prettierrc'
      - 'LICENSE'

# Prevent concurrent runs for the same branch/PR
# Cancels in-progress runs when a new commit is pushed
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Parallel quality checks for faster feedback
  type-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Type Check
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm run sync

      - name: Type check
        working-directory: frontend
        run: pnpm run check
        continue-on-error: false

  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Lint
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm run lint
        continue-on-error: false

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Test
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm run sync

      - name: Run tests
        working-directory: frontend
        run: pnpm run test
        continue-on-error: false

  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    name: Build
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm run sync

      - name: Build
        working-directory: frontend
        run: pnpm run build
        continue-on-error: false

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Error: build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "❌ Error: build/index.html not found"
            exit 1
          fi
          echo "✅ Build output verified successfully"
          echo ""
          echo "Build statistics:"
          echo "  Total size: $(du -sh build/ | cut -f1)"
          echo "  Files: $(find build/ -type f | wc -l)"
          echo "  Directories: $(find build/ -type d | wc -l)"

  # Deploy to Cloudflare Pages after successful build.
  # Dependabot PRs run against Dependabot's own secret store, which does not
  # carry CLOUDFLARE_API_TOKEN, so wrangler fails and drags ci-success down with
  # it. Skip the preview deploy for them — ci-success counts a skipped Deploy as
  # a pass, and the merge to main still deploys via cloudflare-pages.yml.
  deploy:
    needs: [build]
    if: |
      (needs.build.result == 'success') &&
      (github.event.pull_request.draft == false) &&
      (github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24.13.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        working-directory: frontend
        run: pnpm run sync

      - name: Build
        working-directory: frontend
        run: pnpm run build
        continue-on-error: false

      - name: Verify build output
        working-directory: frontend
        run: |
          if [ ! -d "build" ]; then
            echo "❌ Error: build directory not found"
            exit 1
          fi
          if [ ! -f "build/index.html" ]; then
            echo "❌ Error: build/index.html not found"
            exit 1
          fi
          echo "✅ Build output verified successfully"
          echo "Build size:"
          du -sh build/

      - name: Determine deployment type
        id: deployment
        run: |
          # Get the PR head branch (source branch)
          BRANCH="${{ github.event.pull_request.head.ref }}"

          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Deploying to PREVIEW (PR targeting main)"
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "branch=$BRANCH" >> $GITHUB_OUTPUT
            echo "Deploying to PREVIEW (feature branch)"
          fi

      # wrangler-action replaces the deprecated cloudflare/pages-action@v1.
      # Outputs: deployment-url (atomic) and pages-deployment-alias-url (branch alias).
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/build --project-name=zhaoyu-io --branch=${{ steps.deployment.outputs.branch }}

      - name: Check deployment status
        if: steps.deploy.outcome == 'success'
        run: |
          echo "✅ Deployment completed successfully!"
          echo "Deployment may take a few moments to propagate."

      - name: Output Deployment URLs
        if: steps.deploy.outcome == 'success'
        run: |
          echo "🌐 Deployment completed successfully!"
          echo ""
          echo "**Preview Deployment URLs:**"
          echo "  - Atomic URL: ${{ steps.deploy.outputs.deployment-url }}"
          echo "  - Branch Alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}"
          echo ""
          echo "⚠️  If you see 'Nothing is here yet' when visiting the URL:"
          echo "   1. Wait 1-2 minutes for deployment to propagate"
          echo "   2. Check Cloudflare Pages dashboard → Deployments tab"
          echo "   3. Verify the deployment status is 'Success'"

      - name: Extract deployment URLs
        if: |
          steps.deployment.outputs.environment == 'preview' &&
          steps.deploy.outcome == 'success'
        id: extract-urls
        run: |
          echo "Extracting deployment URLs from Cloudflare Pages action..."
          ATOMIC_URL="${{ steps.deploy.outputs.deployment-url }}"
          ALIAS_URL="${{ steps.deploy.outputs.pages-deployment-alias-url }}"

          if [ -z "$ATOMIC_URL" ]; then
            echo "❌ ERROR: Atomic URL is empty!"
            exit 1
          fi

          if [ -n "$ALIAS_URL" ] && [ "$ALIAS_URL" != "$ATOMIC_URL" ]; then
            echo "preview_url=$ALIAS_URL" >> $GITHUB_OUTPUT
          else
            echo "preview_url=$ATOMIC_URL" >> $GITHUB_OUTPUT
          fi
          echo "atomic_url=$ATOMIC_URL" >> $GITHUB_OUTPUT
          echo "✅ Extracted preview URL: $(cat $GITHUB_OUTPUT | grep preview_url | cut -d'=' -f2-)"

      - name: Record GitHub deployment (View deployment button)
        if: |
          steps.deploy.outcome == 'success' &&
          steps.extract-urls.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const previewUrl = '${{ steps.extract-urls.outputs.preview_url }}'.trim();
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: 'preview',
              transient_environment: true,
              auto_merge: false,
              required_contexts: [],
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: previewUrl,
              auto_inactivate: true,
            });
            console.log('✅ Deployment record created:', previewUrl);

      - name: Comment Preview URL on PR
        if: |
          steps.deployment.outputs.environment == 'preview' &&
          steps.deploy.outcome == 'success' &&
          steps.extract-urls.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const branch = '${{ steps.deployment.outputs.branch }}';

            console.log('✅ Found PR #' + prNumber + ' for branch: ' + branch);

            // Get URLs from extract-urls step
            const previewUrl = '${{ steps.extract-urls.outputs.preview_url }}'.trim();
            const atomicUrl = '${{ steps.extract-urls.outputs.atomic_url }}'.trim();

            console.log('Deployment URLs:', {
              previewUrl: previewUrl || '(empty)',
              atomicUrl: atomicUrl || '(empty)',
              branch: branch
            });

            // Validate URL. Note: it is impossible to compare against a literal
            // interpolation placeholder here — GitHub substitutes expressions
            // inside this script block too, so such a guard always matches.
            if (!previewUrl) {
              console.error('❌ Preview URL is empty or not set!');
              console.error('Check the "Extract deployment URLs" step logs for details.');
              return;
            }

            console.log('Using preview URL:', previewUrl);

            // Format the URL as a clickable link
            const urlLink = '[' + previewUrl + '](' + previewUrl + ')';

            let comment = '## 🌐 Preview Deployment\n\n';
            comment += '**Branch:** `' + branch + '`\n';
            comment += '**Preview URL:** ' + urlLink + '\n';

            // Show atomic URL if different from preview URL
            if (atomicUrl && atomicUrl !== previewUrl) {
              const atomicLink = '[' + atomicUrl + '](' + atomicUrl + ')';
              comment += '**Atomic URL:** ' + atomicLink + ' (specific deployment)\n';
            }

            comment += '\n';
            comment += '> ⚠️ **Note:** The preview URL may take 1-2 minutes to become active. If you see "Nothing is here yet" or a Cloudflare Access login, wait a moment and refresh.\n';
            comment += '> \n';
            comment += '> You can also check the [Cloudflare Pages dashboard](https://dash.cloudflare.com/) for deployment status.';

            // Check if we've already commented on this PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            // Look for existing comment from this workflow
            // Match by "Preview Deployment" header and branch name
            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment') &&
              comment.body.includes('`' + branch + '`')
            );

            try {
              if (botComment) {
                // Update existing comment
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: comment
                });
                console.log('✅ Updated preview URL comment on PR #' + prNumber);
              } else {
                // Create new comment
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: comment
                });
                console.log('✅ Posted preview URL comment on PR #' + prNumber);
                console.log('Preview URL:', previewUrl);
              }
            } catch (error) {
              console.error('❌ Error posting comment to PR:', error.message);
              console.error('Error details:', error);
              throw error;
            }

  # Summary job that depends on all checks passing
  ci-success:
    runs-on: ubuntu-latest
    name: CI Success
    timeout-minutes: 1
    permissions:
      contents: read
    needs: [type-check, lint, test, build, deploy]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          # Check jobs (allow skipped results for draft PRs, path filtering,
          # or the Dependabot deploy skip)
          # Only fail if result is "failure", allow "success" or "skipped"
          check_job() {
            local result="$1"
            local job_name="$2"
            if [ "$result" == "failure" ]; then
              echo "❌ $job_name failed"
              return 1
            elif [ "$result" == "skipped" ]; then
              echo "⏭️  $job_name skipped (draft PR, path filtering, or Dependabot)"
              return 0
            elif [ "$result" == "success" ]; then
              echo "✅ $job_name passed"
              return 0
            else
              echo "⚠️  $job_name has unexpected result: $result"
              return 1
            fi
          }

          FAILED=0
          check_job "${{ needs.type-check.result }}" "Type check" || FAILED=1
          check_job "${{ needs.lint.result }}" "Lint" || FAILED=1
          check_job "${{ needs.test.result }}" "Test" || FAILED=1
          check_job "${{ needs.build.result }}" "Build" || FAILED=1
          check_job "${{ needs.deploy.result }}" "Deploy" || FAILED=1

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ One or more CI checks failed"
            exit 1
          fi
          echo ""
          echo "✅ All CI checks passed or were skipped (as expected)"
